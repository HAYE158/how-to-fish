<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沙滩小螃蟹 3D 模型预览</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f6f8fb 0%, #eaf1f7 100%);
      color: #1f2937;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    header span {
      font-size: 12px;
      color: #6b7280;
    }
    main {
      flex: 1;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    .hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      color: #4b5563;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>《如何开船》沙滩小螃蟹 · Low-Poly 3D 预览</h1>
    <span>风格：类《人类一败涂地》卡通低模 · beach_crab.glb</span>
  </header>
  <main>
    <model-viewer
      src="./beach_crab.glb"
      poster="./beach_crab_preview.png"
      alt="沙滩小螃蟹低多边形 3D 模型"
      camera-controls
      auto-rotate
      shadow-intensity="0.8"
      exposure="1.05"
      environment-image="neutral"
      interaction-prompt="none">
    </model-viewer>
    <div class="hint">鼠标左键旋转 · 滚轮缩放 · 右键平移</div>
  </main>
</body>
</html>
